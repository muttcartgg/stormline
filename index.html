<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stormline Radar</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stormline">
<meta name="theme-color" content="#0a0f15">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed map; instrument strip on top; dock at bottom = sheet + color scale + timeline + tabs */
:root{
  --ground:#0a0f15; --panel:#111922; --panel-2:#16212c; --line:#24323f;
  --ink:#dbe4ec; --ink-dim:#7f91a3; --scope:#f3b23a; --scope-ink:#1a1204;
  --tor:#ff2a2a; --svr:#ffd23f; --ffw:#2fe06b; --emer:#ff3df2; --info:#5fb3ff; --good:#2fe06b;
  --ui:"Saira Semi Condensed",ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; --fade:.25s;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink);font:15px/1.4 var(--ui);overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--scope);outline-offset:2px}
[hidden]{display:none!important}
a{color:var(--scope)}
#map{position:fixed;inset:0;background:var(--ground)}
.leaflet-container{background:var(--ground);font:inherit}
.leaflet-control-attribution{background:rgba(10,15,21,.7)!important;color:var(--ink-dim)!important;font-size:9px!important;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaflet-control-attribution a{color:var(--ink-dim)!important}
.leaflet-control-zoom{display:none}
.leaflet-bottom{bottom:calc(var(--dock-h,170px))!important}
.leaflet-radar-pane .leaflet-layer{transition:opacity var(--fade) linear}
body.enhance .leaflet-radar-pane{filter:contrast(1.25) saturate(1.35)}

/* Top instrument strip */
#top{position:fixed;left:0;right:0;top:0;z-index:1000;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
.row{display:flex;gap:8px;align-items:center}
.glass{background:rgba(17,25,34,.92);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.site{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left}
.site b{font-family:var(--mono);font-weight:500;color:var(--scope);font-size:15px;letter-spacing:.02em}
.site span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-dim);font-size:13px}
.site .clock{margin-left:auto;font-family:var(--mono);color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.iconbtn{width:42px;height:42px;flex:none;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8}
.iconbtn.on{background:var(--scope);border-color:var(--scope)}
.iconbtn.on svg{stroke:var(--scope-ink)}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:flex;padding:3px;gap:2px}
.seg button{flex:1;padding:6px 2px;border-radius:9px;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
.seg button[aria-pressed="true"]{background:var(--scope);color:var(--scope-ink)}
#status{font-family:var(--mono);font-size:11px;color:var(--ink-dim);padding:0 4px;text-shadow:0 1px 3px #000}
#status.err{color:#ff8d7a}
#hud{display:flex;flex-wrap:wrap;gap:6px}
.hudchip{display:flex;align-items:center;gap:6px;padding:5px 10px;font-size:12px;font-weight:600;border-radius:999px;text-align:left}
.hudchip i{width:9px;height:9px;border-radius:50%;flex:none}
.hudchip.warn{border-color:#ff8d7a;color:#ffb3a6}
#banner{display:flex;gap:10px;align-items:center;border-radius:var(--r);padding:8px 12px;font-weight:600;text-align:left;color:#120000;background:var(--tor);box-shadow:0 4px 18px rgba(0,0,0,.4)}
#banner small{display:block;font-weight:500;opacity:.85}

/* Dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column}
#sheet{max-height:min(56vh,520px);overflow-y:auto;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line);padding:14px 16px 18px}
#sheet h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 10px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#sheet h2 small{letter-spacing:0;text-transform:none;font-family:var(--mono);font-size:11px}
#sheet h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin:20px 0 8px;font-weight:600}
.empty{color:var(--ink-dim);font-size:14px;padding:6px 0}
.note{color:var(--ink-dim);font-size:12px;margin-top:6px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:start;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 0;text-align:left;width:100%}
.item .stripe{align-self:stretch;border-radius:0 3px 3px 0}
.item .t{font-weight:600;font-size:15px;line-height:1.25}
.item .s{color:var(--ink-dim);font-size:13px;margin-top:2px;min-width:0}
.item .m{font-family:var(--mono);font-size:12px;color:var(--ink);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:var(--ground)}
.chip.hot{border-color:var(--tor);color:#ff8d8d}
.chip.warm{border-color:var(--svr);color:var(--svr)}
.chip.new{background:var(--tor);border-color:var(--tor);color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.filters button{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-dim)}
.filters button[aria-pressed="true"]{border-color:var(--scope);color:var(--scope);background:rgba(243,178,58,.08)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600}
.btn.primary{background:var(--scope);border-color:var(--scope);color:var(--scope-ink)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* Forecast */
.now{display:flex;gap:14px;align-items:center}
.now .ic svg{width:56px;height:56px}
.now .temp{font-size:54px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.now .desc{font-size:16px;min-width:0}
.now .desc small{display:block;color:var(--ink-dim);font-size:13px}
.nowcast{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-size:14px;display:flex;gap:8px;align-items:center}
.nowcast i{width:8px;height:8px;border-radius:50%;background:var(--info);flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.tile{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tile .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
.tile .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .v small{font-size:12px;font-weight:500;color:var(--ink-dim)}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.hour{flex:none;width:58px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-variant-numeric:tabular-nums}
.hour .h{font-size:11px;color:var(--ink-dim);font-family:var(--mono)}
.hour svg{width:26px;height:26px;margin:2px auto 0;display:block}
.hour .tt{font-size:17px;font-weight:600}
.hour .p{font-size:11px;font-family:var(--mono);color:var(--info)}
.chart{width:100%;height:auto;display:block}
.day{display:grid;grid-template-columns:28px 88px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.day:first-child{border-top:0}
.day svg{width:26px;height:26px}
.day .n{font-weight:600}
.day .f{color:var(--ink-dim);font-size:14px;min-width:0}
.day .tt{font-family:var(--mono);font-variant-numeric:tabular-nums}
details.more summary{color:var(--scope);font-size:13px;cursor:pointer;margin-top:4px}
details.more p{color:var(--ink-dim);font-size:13px;margin:6px 0 0}
.prod{white-space:pre-wrap;font-family:var(--mono);font-size:11.5px;line-height:1.5;background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:340px;overflow:auto;margin-top:8px}

/* Outlook */
.risk{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:6px 0}
.risk span{height:8px;border-radius:2px;background:var(--line)}
.dayrisk{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dayrisk .lvl{font-size:18px;font-weight:700}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.meter b{display:block;height:100%;border-radius:3px}

/* Menu */
.opt{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);gap:12px}
.opt label{flex:1}
.opt small{display:block;color:var(--ink-dim);font-size:12px}
.toggle{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .15s}
.toggle:checked{background:var(--scope)}
.toggle:checked::after{transform:translateX(18px);background:var(--scope-ink)}
input[type=range]{width:100%;accent-color:var(--scope)}
select,input[type=search]{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:16px}
input[type=search]{width:100%}
.opt .rng{width:46%}
.health{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.health i{width:8px;height:8px;border-radius:50%}

/* Color scale + timeline */
#scale{padding:8px 16px 0;display:flex;flex-direction:column;gap:3px}
#scale .bar{height:7px;border-radius:4px}
#scale .ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
#timeline{display:flex;align-items:center;gap:8px;padding:6px 12px 2px}
#play{width:40px;height:40px;border-radius:50%;background:var(--scope);display:grid;place-items:center;flex:none}
#play svg{width:16px;height:16px;fill:var(--scope-ink)}
.stepbtn{width:30px;height:36px;display:grid;place-items:center;flex:none;color:var(--ink-dim)}
.stepbtn svg{width:16px;height:16px;fill:currentColor}
.scrubwrap{flex:1;min-width:0;display:flex;flex-direction:column}
#marks{display:flex;justify-content:space-between;padding:0 8px;margin-top:-2px}
#marks i{width:2px;height:5px;background:var(--line);border-radius:1px}
#marks i.on{background:var(--scope)}
#ftime{font-family:var(--mono);font-size:13px;min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
#ftime small{display:block;font-size:10px;color:var(--ink-dim)}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);padding:2px 6px 6px}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);position:relative}
#tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
#tabs button[aria-selected="true"]{color:var(--scope)}
#tabs .badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--tor);color:#fff;font-size:10px;display:grid;place-items:center;font-family:var(--mono)}

/* Bare mode, toast, takeover, offline */
body.bare #top>*:not(#bareRow),body.bare #dock>*:not(#timeline){display:none!important}
#bareRow{display:none}
body.bare #bareRow{display:flex;justify-content:flex-end}
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--dock-h,170px) + 12px);z-index:1100;padding:10px 14px;border-radius:var(--r);font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.45);display:flex;gap:10px;align-items:center;justify-content:space-between}
#takeover{position:fixed;inset:0;z-index:3000;background:#7a0000;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px)}
#takeover h1{font-size:40px;line-height:1.05;margin:0;text-wrap:balance}
#takeover p{margin:0;font-size:17px}
#takeover .btn{background:#fff;color:#7a0000;border:0;font-size:17px;padding:14px;border-radius:12px}
#takeover .chip{background:transparent;border-color:#fff;color:#fff}
@keyframes pulse{50%{background:#b30000}}
#takeover.pulse{animation:pulse 1.2s ease-in-out infinite}

/* Map markers & popups */
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:12px 14px;font:14px/1.4 var(--ui);max-height:46vh;overflow-y:auto}
.leaflet-container a.leaflet-popup-close-button{color:var(--ink-dim)}
.pop h4{margin:0 0 4px;font-size:16px}
.pop .meta{font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
.pop p{margin:8px 0 0;white-space:pre-wrap;font-size:13px;color:var(--ink)}
.pop table{border-collapse:collapse;margin-top:6px;font-family:var(--mono);font-size:12px}
.pop td{padding:2px 10px 2px 0;vertical-align:top}
.pop td:first-child{color:var(--ink-dim)}
.pop .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pop .acts button{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.sitelbl{font-family:var(--mono);font-size:10px;color:var(--ink);background:rgba(10,15,21,.8);border:1px solid var(--line);border-radius:4px;padding:1px 4px;white-space:nowrap;transform:translate(-50%,-50%);display:inline-block}
.sitelbl.on{background:var(--scope);color:var(--scope-ink);border-color:var(--scope)}
.lsr{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--mono);color:#000;border:1.5px solid #000;transform:translate(-50%,-50%)}
.cellic{transform:translate(-50%,-50%);display:block}
.obs{transform:translate(-50%,-50%);display:flex;align-items:center;gap:2px;font:600 11px/1 var(--mono);color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap}
.obs svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2}
.me{width:16px;height:16px;border-radius:50%;background:var(--info);border:3px solid #fff;box-shadow:0 0 0 6px rgba(95,179,255,.25);transform:translate(-50%,-50%);position:relative}
.me.chase{background:var(--scope)}
.measurelbl{font:600 12px/1 var(--mono);background:var(--scope);color:var(--scope-ink);padding:4px 7px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-140%);display:inline-block}
@media (prefers-reduced-motion:reduce){.iconbtn.spin svg,#takeover.pulse{animation:none}.leaflet-radar-pane .leaflet-layer{transition:none}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Radar map"></div>

<div id="top">
  <div class="row" id="bareRow"><button class="iconbtn glass" id="unbareBtn" aria-label="Show controls"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
  <div class="row">
    <button class="site glass" id="siteBtn" aria-label="Radar site">
      <b id="siteId">US</b><span id="siteName">National mosaic</span><span class="clock" id="clock">--:--</span>
    </button>
    <button class="iconbtn glass" id="locateBtn" aria-label="Go to my location"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
    <button class="iconbtn glass" id="refreshBtn" aria-label="Refresh data"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
  </div>
  <div class="seg glass" role="group" aria-label="Radar product">
    <button data-mode="ref" aria-pressed="false">Reflect</button>
    <button data-mode="srv" aria-pressed="false">Velocity</button>
    <button data-mode="mosaic" aria-pressed="true">Mosaic</button>
    <button data-mode="future" aria-pressed="false">Future</button>
    <button data-mode="ptype" aria-pressed="false">P-Type</button>
  </div>
  <button id="banner" hidden></button>
  <div id="hud"></div>
  <div id="status">Loading…</div>
</div>

<div id="toast" class="glass" hidden></div>
<div id="takeover" hidden></div>

<div id="dock">
  <div id="sheet" hidden></div>
  <div id="scale"><div class="bar" id="scaleBar"></div><div class="ticks" id="scaleTicks"></div></div>
  <div id="timeline">
    <button class="stepbtn" id="back" aria-label="Previous frame"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
    <button id="play" aria-label="Play loop"><svg viewBox="0 0 16 16" id="playIcon"><path d="M3 1.5v13l11-6.5z"/></svg></button>
    <button class="stepbtn" id="fwd" aria-label="Next frame"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
    <div class="scrubwrap"><input type="range" id="scrub" min="0" max="0" value="0" aria-label="Frame"><div id="marks"></div></div>
    <div id="ftime">--:--<small>&nbsp;</small></div>
  </div>
  <nav id="tabs" role="tablist">
    <button role="tab" data-tab="alerts" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/></svg>Alerts<span class="badge" id="alertBadge" hidden></span></button>
    <button role="tab" data-tab="storms" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="7" cy="16" r="3"/><path d="M9.5 14.5 19 6M15 6h4v4"/></svg>Storms</button>
    <button role="tab" data-tab="forecast" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="4"/><path d="M9 1.5v2M1.5 9h2M3.7 3.7l1.4 1.4M14.3 3.7l-1.4 1.4"/><path d="M8 20h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.5A3.3 3.3 0 0 0 8 20z"/></svg>Forecast</button>
    <button role="tab" data-tab="outlook" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Severe</button>
    <button role="tab" data-tab="menu" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu</button>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
"use strict";
const IEM = "https://mesonet.agron.iastate.edu";
const NWS = "https://api.weather.gov";
const OM = "https://api.open-meteo.com/v1/forecast";
const tileURL = name => `${IEM}/cache/tile.py/1.0.0/${name}/{z}/{x}/{y}.png`;
const ESRI = p => `https://server.arcgisonline.com/ArcGIS/rest/services/${p}/MapServer/tile/{z}/{y}/{x}`;

/* ---------- NEXRAD sites (IEM 3-letter ids) ---------- */

async function getJSON(url, feed, opts = {}) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 20000);
  try {
    const r = await fetch(url, { ...opts, signal: ctl.signal, headers: { Accept: "application/geo+json, application/json", ...(opts.headers || {}) } });
    if (!r.ok) throw new Error(`${r.status} from ${new URL(url).host}`);
    const j = await r.json();
    if (feed) S.health[feed] = { ok: true, at: new Date() };
    return j;
  } catch (e) {
    if (feed) S.health[feed] = { ok: false, at: new Date(), err: e.name === "AbortError" ? "timed out" : e.message };
    throw e;
  } finally { clearTimeout(t); }
}

    const on = s.id === S.site && isSiteMode();
    L.marker([s.lat, s.lon], { pane: "cells", icon: L.divIcon({ className: "", html: `<span class="sitelbl${on ? " on" : ""}">${s.icao}</span>`, iconSize: [0, 0] }), keyboard: false })

  }
}
function drawRings() {

  const s = SITES.find(x => x.id === S.site); if (!s || !isSiteMode()) return;
  [25, 50, 100, 150].forEach(m => {

function nowcastText(om) {
  if (!om || !om.minutely_15) return null;
  const t = om.minutely_15.time, pr = om.minutely_15.precipitation, now = Date.now();
  // Open-Meteo returns the place's local time; the offset makes it an absolute instant

  const upcoming = t.map((s, i) => ({ when: parse(s), v: pr[i] || 0 })).filter(x => x.when.getTime() > now - 15 * 60000).slice(0, 8);
  if (!upcoming.length) return null;
  const wet = x => x.v >= 0.005;
  if (wet(upcoming[0])) { const stopI = upcoming.findIndex(x => !wet(x)); return stopI === -1 ? "Rain continues for at least the next 2 hours." : `Rain ending around ${fmtT(upcoming[stopI].when)}.`; }

}
function hourlyChart(hours) {
  const W = 340, H = 110, pad = { l: 26, r: 6, t: 10, b: 20 };
  const temps = hours.map(h => S.u.temp === "C" ? (h.temperature - 32) * 5 / 9 : h.temperature);
  const lo = Math.floor(Math.min(...temps) - 2), hi = Math.ceil(Math.max(...temps) + 2);
  const x = i => pad.l + i * (W - pad.l - pad.r) / (hours.length - 1);
  const y = v => pad.t + (hi - v) * (H - pad.t - pad.b) / (hi - lo || 1);
  const bw = (W - pad.l - pad.r) / hours.length * 0.6;
  const bars = hours.map((h, i) => { const pp = (h.probabilityOfPrecipitation && h.probabilityOfPrecipitation.value) || 0; const bh = pp / 100 * (H - pad.t - pad.b); return pp ? `<rect x="${x(i) - bw / 2}" y="${H - pad.b - bh}" width="${bw}" height="${bh}" fill="#5fb3ff" opacity=".35"/>` : ""; }).join("");
  const path = temps.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area = `${path}L${x(temps.length - 1)},${H - pad.b}L${x(0)},${H - pad.b}Z`;
  const ticks = [lo, Math.round((lo + hi) / 2), hi].map(v => `<text x="${pad.l - 5}" y="${y(v) + 3}" text-anchor="end" font-size="9" fill="#7f91a3" font-family="IBM Plex Mono,monospace">${v}°</text><line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="#24323f" stroke-width=".6"/>`).join("");
  const xl = hours.map((h, i) => i % 4 ? "" : `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="9" fill="#7f91a3" font-family="IBM Plex Mono,monospace">${esc(fmtH(new Date(h.startTime)))}</text>`).join("");
  const iMax = temps.indexOf(Math.max(...temps));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Temperature and rain chance, next 24 hours">${ticks}${bars}<path d="${area}" fill="#f3b23a" opacity=".12"/><path d="${path}" fill="none" stroke="#f3b23a" stroke-width="2"/><circle cx="${x(iMax)}" cy="${y(temps[iMax])}" r="3.5" fill="#f3b23a"/>${xl}</svg>`;
}

const RISKS = [["TSTM", "Thunder", "#c1e9c1"], ["MRGL", "Marginal", "#66a366"], ["SLGT", "Slight", "#f6f67f"], ["ENH", "Enhanced", "#e6c27a"], ["MDT", "Moderate", "#e67f7f"], ["HIGH", "High", "#ff66ff"]];

  const p = S.forecastAt || S.home || ll(map.getCenter());
  const key = `${p.lat.toFixed(2)},${p.lon.toFixed(2)}`;
  if (S.outlook && S.outlook.key === key && !force && Date.now() - S.outlook.at < 20 * 60000) return;
  S.outlook = { loading: true }; if (S.tab === "outlook") renderSheet();
  const out = { key, at: Date.now(), p };
  await Promise.allSettled([
    (async () => {
      const j = await getJSON(`${IEM}/api/1/nws/outlook_by_point.json?lat=${p.lat.toFixed(3)}&lon=${p.lon.toFixed(3)}`, "SPC outlook");
      const days = {};

        const d = days[r.day] = days[r.day] || { cat: -1, probs: {} };
        if (r.category === "CATEGORICAL") { const i = RISKS.findIndex(x => x[0] === r.threshold); if (i > d.cat) d.cat = i; }
        else { const k = r.category; const v = r.threshold === "SIGN" ? "sig" : Math.round(parseFloat(r.threshold) * 100); d.probs[k] = d.probs[k] || []; d.probs[k].push(v); }

      <div class="note">Stormline uses free public data with no API keys. Radar, storm attributes, reports, watches, discussions, satellite and HRRR from the Iowa Environmental Mesonet. Alerts, forecasts and observations from api.weather.gov. Outlook from NOAA SPC. Model parameters, air quality and place search from Open-Meteo. Basemaps © Esri and © OpenStreetMap contributors. Not an official warning source: always follow the NWS and local officials.</div>`;

    el.querySelectorAll("[data-layer]").forEach(inp => inp.onchange = () => {
      const k = inp.dataset.layer; S.layers[k] = inp.checked; saveLayers(); applyStaticLayers();
      if (k === "allAlerts") drawAlerts(); if (k === "weakCells") drawCells(); if (k === "nearHud") updateHud();
      if (k === "labels") applyBasemap(); if (k === "obs" && inp.checked) loadObs();
    });
    el.querySelectorAll("[data-bm]").forEach(b => b.onclick = () => { S.basemap = b.dataset.bm; store.set("basemap", S.basemap); applyBasemap(); renderSheet(); });
    $("#op").oninput = e => { S.opacity = +e.target.value; store.set("opacity", S.opacity); showFrame(S.idx); };
    $("#sp").oninput = e => { S.speed = 1150 - +e.target.value; store.set("speed", S.speed); setFade(); };
    $("#dw").onchange = e => { S.dwell = +e.target.value; store.set("dwell", S.dwell); };
    $("#nf").onchange = e => { S.nFrames = +e.target.value; store.set("nFrames", S.nFrames); loadFrames(); };
    $("#rf").onchange = e => { S.refreshMin = +e.target.value; store.set("refreshMin", S.refreshMin); scheduleRadarRefresh(); };
    const unit = (id, key) => $(id).onchange = e => { S.u[key] = key === "clock" ? +e.target.value : e.target.value; store.set("units", S.u); drawRings(); drawCells(); if (S.obs.length) loadObs(); updateHud(); showFrame(S.idx); $("#clock").textContent = fmtT(new Date()); };
    unit("#ut", "temp"); unit("#us", "speed"); unit("#ud", "dist"); unit("#uc", "clock");
    $("#testTone").onclick = () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } beep(1); };
    $("#chaseBtn").onclick = () => { toggleChase(); renderSheet(); };
    $("#measureBtn").onclick = () => { S.measure = S.measure ? null : { pts: [] }; measureLayer.clearLayers(); updateHud(); renderSheet(); if (S.measure) openTab("menu"); };
    $("#bareBtn").onclick = () => { openTab("menu"); document.body.classList.add("bare"); measureDock(); };
    $("#shareApp").onclick = () => shareText("Stormline Radar", location.href);
    const sh = $("#saveHome"); if (sh) sh.onclick = () => { S.places.push({ name: "My location", lat: S.home.lat, lon: S.home.lon }); store.set("places", S.places); refreshPlacesBadges(); };
    const bh = $("#backHome"); if (bh) bh.onclick = () => { S.forecastAt = null; S.forecast = null; S.outlook = null; map.setView([S.home.lat, S.home.lon], 8); renderSheet(); };
    el.querySelectorAll("[data-go]").forEach(b => b.onclick = () => goPlace(S.places[+b.dataset.go]));
    el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { S.places.splice(+b.dataset.del, 1); store.set("places", S.places); refreshPlacesBadges(); renderSheet(); });
    let qT; $("#placeQ").oninput = e => {
      clearTimeout(qT); const q = e.target.value.trim(); const box = $("#placeResults");
      if (q.length < 2) { box.innerHTML = ""; return; }
      qT = setTimeout(async () => {
        try {
          const r = await searchPlaces(q);
          box.innerHTML = r.length ? r.map((x, i) => `<div class="item" style="padding-right:8px"><span class="stripe" style="background:var(--line)"></span><button style="text-align:left;min-width:0" data-pr="${i}"><span class="t">${esc(x.name)}</span><div class="s">${esc([x.admin1, x.country_code].filter(Boolean).join(", "))}</div></button><button class="btn" data-ps="${i}">Save</button></div>`).join("") : `<div class="empty">No places found.</div>`;
          const mk = x => ({ name: `${x.name}${x.admin1 ? ", " + x.admin1 : ""}`, lat: x.latitude, lon: x.longitude });
          box.querySelectorAll("[data-pr]").forEach(b => b.onclick = () => goPlace(mk(r[+b.dataset.pr])));
          box.querySelectorAll("[data-ps]").forEach(b => b.onclick = () => { S.places.push(mk(r[+b.dataset.ps])); store.set("places", S.places); refreshPlacesBadges(); toast("Saved."); });
        } catch { box.innerHTML = `<div class="empty">Place search isn't reachable right now.</div>`; }
      }, 350);
    };
  }
};
function focusItem(kind, i) {
  const pop = (latlng, content) => L.popup({ maxWidth: 320 }).setLatLng(latlng).setContent(content).openOn(map);
  if (kind === "alert") { const f = S.alerts[i]; if (f && f._layer) { map.fitBounds(f._layer.getBounds(), { padding: [30, 30], maxZoom: 10 }); f._layer.openPopup(); } }
  if (kind === "home") { const f = homeAlerts[i]; if (!f) return; if (f.geometry) map.fitBounds(L.geoJSON(f).getBounds(), { padding: [30, 30], maxZoom: 10 }); pop(S.home ? [S.home.lat, S.home.lon] : map.getCenter(), alertPopupEl(f.properties)); }
  if (kind === "cell") { const c = S.cells[i]; map.setView([c.lat, c.lon], 9); pop([c.lat, c.lon], cellPopup(c)); if (isSiteMode()) { const s = SITES.find(x => x.id === c.nexrad); if (s && s.id !== S.site) selectSite(s.id); } }
  if (kind === "lsr") { const r = S.lsrs[i]; map.setView([r.lat, r.lon], 9); pop([r.lat, r.lon], lsrPopup(r)); }
  if (kind === "watch" || kind === "md") { const f = (kind === "watch" ? S.watches : S.mds)[i]; if (f && f._layer) { map.fitBounds(f._layer.getBounds(), { padding: [30, 30] }); f._layer.openPopup(); } }
}

/* ---------- tap the map: inspect / measure ---------- */
map.on("click", e => {
  const p = ll(e.latlng);
  if (S.measure) {
    if (S.measure.pts.length >= 2) { S.measure.pts = []; measureLayer.clearLayers(); }
    S.measure.pts.push(p);
    L.circleMarker([p.lat, p.lon], { radius: 5, color: "#000", weight: 1.5, fillColor: "#f3b23a", fillOpacity: 1, interactive: false }).addTo(measureLayer);
    if (S.measure.pts.length === 2) {
      const [a, b] = S.measure.pts, d = distKm(a, b);
      L.polyline([[a.lat, a.lon], [b.lat, b.lon]], { color: "#f3b23a", weight: 2.5, dashArray: "6 4", interactive: false }).addTo(measureLayer);
      const mid = { lat: (a.lat + b.lat) / 2, lon: (a.lon + b.lon) / 2 };
      L.marker([mid.lat, mid.lon], { interactive: false, icon: L.divIcon({ className: "", html: `<span class="measurelbl">${dist(d, 1)} · ${Math.round(bearing(a, b))}° ${compass(bearing(a, b))}</span>`, iconSize: [0, 0] }) }).addTo(measureLayer);
    }
    return;
  }
  const s = isSiteMode() ? SITES.find(x => x.id === S.site) : nearestSite(p);
  const near = nearestSite(p), dk = distKm(p, s);
  const here = S.alerts.filter(f => pointInPoly(p, f.geometry)).map(f => f.properties);
  const div = L.DomUtil.create("div", "pop");
  div.innerHTML = `<h4>${p.lat.toFixed(3)}, ${p.lon.toFixed(3)}</h4>
    <table><tr><td>From ${s.icao}</td><td>${dist(dk)} ${compass(bearing(s, p))}</td></tr>
    <tr><td>Beam height</td><td>~${Math.round(beamHeightFt(dk) / 100) * 100} ft (0.5° scan)</td></tr>
    ${S.home ? `<tr><td>From you</td><td>${dist(distKm(S.home, p), 1)} ${compass(bearing(S.home, p))}</td></tr>` : ""}</table>` +
    (here.length ? `<div class="chips">${here.map(a => `<span class="chip" style="border-color:${alertStyle(a).color};color:${alertStyle(a).color}">${esc(a.event)}</span>`).join("")}</div>` : "") +
    `<div class="acts"><button data-a="fc">Forecast here</button>${near.id !== S.site || !isSiteMode() ? `<button data-a="rd">Use ${near.icao}</button>` : ""}<button data-a="sv">Save place</button></div>`;
  div.querySelector('[data-a="fc"]').onclick = () => { S.forecastAt = p; S.forecast = null; S.outlook = null; map.closePopup(); if (S.tab !== "forecast") openTab("forecast"); else loadForecast(true); };
  const rd = div.querySelector('[data-a="rd"]'); if (rd) rd.onclick = () => { map.closePopup(); selectSite(near.id, true); };
  div.querySelector('[data-a="sv"]').onclick = () => { S.places.push({ name: `Pin ${p.lat.toFixed(2)}, ${p.lon.toFixed(2)}`, lat: p.lat, lon: p.lon }); store.set("places", S.places); refreshPlacesBadges(); map.closePopup(); toast("Saved to Menu › Places."); };
  L.popup({ maxWidth: 300 }).setLatLng(e.latlng).setContent(div).openOn(map);
});

/* ---------- location, chase mode, wake lock ---------- */
function placeMe(p, heading) {
  if (meMarker) meMarker.remove();
  const arrow = heading != null && !isNaN(heading) ? `<svg width="40" height="40" viewBox="0 0 40 40" style="position:absolute;left:-15px;top:-15px;transform:rotate(${heading}deg)"><path d="M20 2 26 14H14z" fill="#f3b23a"/></svg>` : "";
  meMarker = L.marker([p.lat, p.lon], { icon: L.divIcon({ className: "", html: `<div class="me${S.chase ? " chase" : ""}">${arrow}</div>`, iconSize: [0, 0] }), interactive: false, zIndexOffset: 2000 }).addTo(map);
}
function setHome(p, fly) {
  S.home = p; store.set("home", p);
  placeMe(p);
  if (fly) map.setView([p.lat, p.lon], 8);
  if (!S.site) { S.site = nearestSite(p).id; store.set("site", S.site); }
  loadHomeAlerts();
  if (!S.homeState) loadForecast();
}
function locate(fly) {
  if (!navigator.geolocation) { setStatus("This browser can't share your location.", true); return; }
  spin(true);
  navigator.geolocation.getCurrentPosition(pos => {
    spin(false);
    const p = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    const first = !S.home; setHome(p, fly || first);
    if (first && S.mode === "mosaic") { S.site = nearestSite(p).id; setMode("ref"); }
  }, err => { spin(false); setStatus(err.code === 1 ? "Location is off. Allow it in Settings › Privacy › Location Services › Safari Websites." : "Couldn't get your location.", true); }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 });
}
let watchId = null, wakeLock = null;
async function toggleChase() {
  S.chase = !S.chase;
  if (S.chase) {
    if (!navigator.geolocation) { S.chase = false; return; }
    watchId = navigator.geolocation.watchPosition(pos => {
      const p = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      S.home = p; placeMe(p, pos.coords.heading); map.panTo([p.lat, p.lon], { animate: true });
      updateHud();
    }, () => toast("Chase mode needs location access."), { enableHighAccuracy: true, maximumAge: 5000 });
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch {}
    toast("Chase mode on. The map follows you and the screen stays awake.");
  } else {
    if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null;
    try { wakeLock && wakeLock.release(); } catch {} wakeLock = null;
    store.set("home", S.home); placeMe(S.home); loadHomeAlerts();
  }
  updateHud();
}
document.addEventListener("visibilitychange", async () => { if (!document.hidden && S.chase && !wakeLock) { try { wakeLock = await navigator.wakeLock.request("screen"); } catch {} } });
$("#locateBtn").onclick = () => locate(true);
$("#siteBtn").onclick = () => { const s = SITES.find(x => x.id === S.site); if (isSiteMode()) { if (s) map.setView([s.lat, s.lon], 8); } else map.setView([38.5, -96], 4); };
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
$("#unbareBtn").onclick = () => { document.body.classList.remove("bare"); measureDock(); };

/* ---------- refresh, clock, offline ---------- */
function spin(on) { $("#refreshBtn").classList.toggle("spin", on); }
const statusLine = () => `Updated ${fmtT(new Date())} · ${S.frames.length} frame${S.frames.length === 1 ? "" : "s"}`;
function refreshAll() { loadFrames(); loadAlerts(); loadHomeAlerts(); loadCells(); loadReports(); loadWatches(); loadMDs(); if (S.layers.obs) loadObs(); if (S.tab === "forecast") loadForecast(true); if (S.tab === "outlook") loadOutlook(true); }
$("#refreshBtn").onclick = refreshAll;
setInterval(() => { $("#clock").textContent = fmtT(new Date()); }, 10000);
$("#clock").textContent = fmtT(new Date());
let radarTimer;
function scheduleRadarRefresh() { clearInterval(radarTimer); if (S.refreshMin) radarTimer = setInterval(() => { if (!document.hidden && S.mode !== "future" && S.mode !== "ptype") loadFrames(); }, S.refreshMin * 60000); }
scheduleRadarRefresh();
setInterval(() => { if (!document.hidden) { loadAlerts(); loadHomeAlerts(); } }, 60000);
setInterval(() => { if (!document.hidden) loadCells(); }, 2 * 60000);
setInterval(() => { if (!document.hidden) { loadReports(); loadWatches(); loadMDs(); } }, 5 * 60000);
setInterval(() => { if (!document.hidden && S.tab === "alerts") renderSheet(); }, 60000);
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => { if (document.hidden) hiddenAt = Date.now(); else if (Date.now() - hiddenAt > 60000) refreshAll(); });
addEventListener("online", () => { updateHud(); refreshAll(); });
addEventListener("offline", updateHud);

function measureDock() { document.documentElement.style.setProperty("--dock-h", $("#dock").offsetHeight + "px"); }
if (window.ResizeObserver) new ResizeObserver(measureDock).observe($("#dock"));

/* ---------- boot ---------- */
applyBasemap();
if (S.home) setHome(S.home, false);
applyStaticLayers(); setFade();
setMode(S.mode);
loadAlerts(); loadCells(); loadReports(); loadWatches(); loadMDs();
locate(false);
if (!store.get("seenTips", false)) { setTimeout(() => toast(`<span>Tip: tap anywhere on the map for forecast, distance and radar beam height. Everything else lives in <b>Menu</b>.</span><button class="btn" id="tipOk">Got it</button>`, 0), 1500); document.addEventListener("click", e => { if (e.target.id === "tipOk") { $("#toast").hidden = true; store.set("seenTips", true); } }); }
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
